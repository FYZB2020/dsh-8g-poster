<!doctype html><meta charset="utf-8"><title>Poster8G · 海报工作台</title>
<style>
html,body{margin:0;height:100%}
body{font:14px/1.7 -apple-system,Segoe UI,Microsoft YaHei;background:#f4f9ff;color:#16283c;display:flex;align-items:center;justify-content:center}
.box{max-width:580px;padding:24px 26px;background:#fff;border:1px solid #d7e6f7;border-radius:14px;box-shadow:0 18px 50px rgba(20,40,70,.14)}
h2{margin:0 0 10px;font-size:17px}
p{margin:7px 0;color:#41536b}
code{display:block;margin:8px 0 10px;padding:10px 12px;background:#f2f7fe;border:1px solid #d7e6f7;border-radius:8px;font:12px/1.5 Consolas,monospace;word-break:break-all;color:#16283c}
button{padding:8px 14px;border:0;border-radius:8px;background:#c0272d;color:#fff;font:600 13px -apple-system,Segoe UI,Microsoft YaHei;cursor:pointer;margin-right:8px}
button.ghost{background:#fff;color:#16283c;border:1px solid #c9dcf2}
.tiny{color:#7b90a8;font-size:12px}
</style>
<div class="box" id="box">正在打开工作台…</div>
<script>
var D = {"seed":null,"projects":[]};
var OPEN = "file:///N:/dsh image/plugin/poster-forge/assets/editor/poster-open.html";
var EMB = false; try { EMB = (window.top !== window.self); } catch (e) { EMB = true; }
function writeSeed(){
  try {
    if (D.seed) { localStorage.setItem("pf.seed", JSON.stringify(D.seed)); localStorage.setItem("jbxa_poster", JSON.stringify(D.seed)); localStorage.setItem("pf.demo", JSON.stringify(D.seed)); }
    localStorage.setItem("pf.projects", JSON.stringify(D.projects || []));
  } catch (e) {}
}
function boot(){ writeSeed(); location.replace("poster-editor.html"); }
if (!EMB) { boot(); } else {
  document.getElementById("box").innerHTML = [
    "<h2>工作台被嵌在小窗里了</h2>",
    "<p>左侧/右侧这个小窗宽度不够，画布会被挤扁。用下面任一方式在浏览器里打开，才是完整尺寸：</p>",
    "<p><b>方式一（最省事）</b>：回到对话窗口，跟我说一句 <b>打开工作台</b> —— 我这边会用系统浏览器整页打开。</p>",
    "<p><b>方式二</b>：点下面「复制地址」，粘到浏览器地址栏回车。</p>",
    "<code id=\"u\"></code>",
    "<p><button id=\"c\">复制地址</button><button class=\"ghost\" id=\"h\">就在这个小窗里打开</button></p>",
    "<p class=\"tiny\">小窗里也能改，只是画布显示得小；导出分辨率不受影响。</p>"
  ].join("");
  document.getElementById("u").textContent = OPEN;
  document.getElementById("c").onclick = function(){
    var t = OPEN;
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(t).then(function(){ document.getElementById("c").textContent = "已复制"; }, function(){ fallback(); }); }
    else fallback();
    function fallback(){ var ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); document.getElementById("c").textContent = "已复制"; } catch (e) {} document.body.removeChild(ta); }
  };
  document.getElementById("h").onclick = boot;
}
</script>
